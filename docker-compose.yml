services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lyftr-chatbot-backend
    container_name: lyftr-backend
    ports:
      - "8000:8000"
    environment:
      # Key pool: at least 2 comma-separated keys -> key_1, key_2, ...
      LLM_API_KEYS: ${LLM_API_KEYS:?set LLM_API_KEYS in .env (copy .env.example)}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-2.0-flash}
      LLM_MODELS: ${LLM_MODELS:-}
      # SQLite lives on the named volume mounted at /data.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      CACHE_TYPE: ${CACHE_TYPE:-disk}
      CACHE_DIR: ${CACHE_DIR:-/data/llm_cache}
      DEFAULT_SYSTEM_PROMPT: ${DEFAULT_SYSTEM_PROMPT:-You are a concise, helpful assistant. Answer clearly and accurately.}
      PORT: "8000"
    volumes:
      - app-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time; the browser calls this URL.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: lyftr-chatbot-frontend
    container_name: lyftr-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  app-data:
    name: lyftr-app-data
