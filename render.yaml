# Render Blueprint for the backend.
# Create > Blueprint > point at this repo, then fill in the `sync: false`
# values (they are deliberately not committed).
services:
  - type: web
    name: lyftr-chatbot-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Set in the dashboard: at least 2 comma-separated keys.
      - key: LLM_API_KEYS
        sync: false
      # Set in the dashboard to the deployed frontend origin,
      # e.g. https://your-app.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-2.0-flash
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: CACHE_TYPE
        value: disk
      - key: CACHE_DIR
        value: /data/llm_cache

    # Render's free plan has no persistent disks, so /data is container-local:
    # history survives restarts within a deploy but resets on redeploy. On a
    # paid instance, uncomment this to make /data durable.
    # disk:
    #   name: app-data
    #   mountPath: /data
    #   sizeGB: 1
